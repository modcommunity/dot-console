[plugin]

name="dot-console"
description="An in-game developer console: a Control bound to a configurable key, command and cvar registries of its own, history and tab completion, an output ring with levels, and a bridge that forwards what it does not know to a remote console. Ships no theme. Depends only on dot-core."
author="dot"
version="0.1.0"
script="dot_console_plugin.gd"
