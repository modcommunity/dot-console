[plugin]

name="dot-console"
description="The player's in-game console: a Control bound to a configurable key, history and tab completion, an output ring with levels, and sources (local commands, a bridge to a server console, a remote forwarder). No command system of its own; dot-server's decides. Ships no theme. Depends only on dot-core."
author="dot"
version="0.1.0"
script="dot_console_plugin.gd"
